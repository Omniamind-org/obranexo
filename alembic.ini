# Migrações do banco: `alembic upgrade head` (o app também aplica sozinho ao subir).
# O banco vem de OBRANEXO_DATABASE_URL; sem ela, o SQLite em data/obranexo.db.
# Migração nova depois de mudar o esquema em src/obranexo/db.py: `alembic revision -m "o que mudou"`.
[alembic]
script_location = obranexo:migracoes

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(message)s
