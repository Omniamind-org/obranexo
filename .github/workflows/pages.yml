# Publica o Business Model Canvas interativo no GitHub Pages.
# Só redeploya quando o site muda (bmc/site/) ou quando este workflow muda: editar código,
# testes, docs/*.md ou o README não gera um deploy novo. Também dá para publicar à mão (workflow_dispatch).
# Requer Settings → Pages → Source = "GitHub Actions" (o modo "Deploy from a branch" publica a cada push).

name: Pages

on:
  push:
    branches: [main]
    paths:
      - "bmc/site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Um deploy por vez; o que estiver em andamento termina antes do próximo
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Publicar bmc/site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: bmc/site
      - id: deployment
        uses: actions/deploy-pages@v4
