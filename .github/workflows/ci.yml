# CI do ObraNexo: lint, testes e benchmark como trava de qualidade.
# Tudo roda em modo determinístico e offline: nenhum job chama LLM nem o PNCP,
# então o resultado não depende de cota de terceiros nem de rede.

name: CI

# Mudanças só de documentação não disparam o CI: o workflow é pulado quando TODOS os arquivos alterados
# casam com a lista abaixo (README e outros .md, docs/, pitch, pesquisa, relatórios, roadmap, BMC e o PDF
# norteador). Basta um arquivo fora dela — código, testes, dados dos casos, este workflow — para rodar.
# Arquivos de teste como tests/dados/*.txt e os PDFs de data/casos continuam disparando.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "pitch/**"
      - "bmc/**"
      - "ROADMAP_MVP.txt"
      - "*.pdf"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "pitch/**"
      - "bmc/**"
      - "ROADMAP_MVP.txt"
      - "*.pdf"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  PYTHONUTF8: "1"
  OBRANEXO_LLM_PROVIDER: none
  OBRANEXO_OFFLINE: "1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Instalar ruff
        run: pip install "ruff==0.17.2"
      - name: ruff check
        run: ruff check src tests eval --output-format=github

  testes:
    name: Testes (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Instalar dependências
        run: pip install -e ".[dev]"
      - name: pytest (sem os testes de integração com LLM)
        run: pytest -m "not integracao" -q

  testes-postgres:
    name: Testes no PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: obranexo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      OBRANEXO_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/obranexo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Instalar dependências
        run: pip install -e ".[dev]"
      - name: Migrações e conferência do esquema (o banco bate com src/obranexo/db.py)
        run: alembic upgrade head && alembic check
      - name: pytest (os mesmos testes, contra o PostgreSQL)
        run: pytest -m "not integracao" -q

  benchmark:
    name: Benchmark (trava de qualidade)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Instalar dependências
        run: pip install -e .
      - name: Benchmark contra os gabaritos
        run: python eval/run_benchmark.py --saida benchmark.json --limiares eval/limiares.json
      - name: Guardar o relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: benchmark.json
          if-no-files-found: ignore

  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Construir a imagem
        run: docker build -t obranexo:ci .
      - name: Subir o contêiner e esperar o healthcheck
        run: |
          docker run -d --name obranexo -p 8000:8000 -e OBRANEXO_LLM_PROVIDER=none -e OBRANEXO_OFFLINE=1 obranexo:ci
          for _ in $(seq 1 45); do
            estado=$(docker inspect -f '{{.State.Health.Status}}' obranexo)
            [ "$estado" = healthy ] && break
            sleep 2
          done
          docker logs obranexo
          test "$estado" = healthy
      - name: Interface, casos de demonstração e login dentro do contêiner
        run: |
          curl -fsS http://localhost:8000/ | grep -q 'js/app.js'
          curl -fsS http://localhost:8000/api/status | python3 -c "import json, sys; d = json.load(sys.stdin); assert d['casos'] >= 9, d; print(d['casos'], 'casos')"
          docker exec obranexo obranexo usuario criar ci@exemplo.com.br --empresa "CI" --senha senha-de-teste-ci
          curl -fsS -X POST http://localhost:8000/api/auth/login -H 'Content-Type: application/json' \
            -d '{"email": "ci@exemplo.com.br", "senha": "senha-de-teste-ci"}' > /dev/null
      - name: docker compose com PostgreSQL (app + db)
        run: |
          docker rm -f obranexo
          docker compose up -d --build --wait
          docker compose exec -T app obranexo usuario criar compose@exemplo.com.br --empresa "Compose" --senha senha-de-teste-ci
          curl -fsS -X POST http://localhost:8000/api/auth/login -H 'Content-Type: application/json' \
            -d '{"email": "compose@exemplo.com.br", "senha": "senha-de-teste-ci"}' > /dev/null
          docker compose exec -T db psql -U obranexo -d obranexo -tAc "select count(*) from usuarios" | grep -qx 1
          docker compose logs app | tail -20
