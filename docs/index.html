<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Canvas ObraNexo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: logo no topo → grade de 9 cartões (5 em cima, 4 embaixo) sobre degradê roxo, seguindo o template do Canva → cada cartão traz resumo e um número-âncora; a seta abre o detalhe em janela */
:root {
  --fundo: #4a0a6a;
  --fundo-escuro: #2c0646;
  --branco: #ffffff;
  --texto: #f3ecff;
  --texto-2: #dccbf5;
  --teal: #14b8ad;
  --teal-escuro: #0e6f69;
  --lavanda: #f1e8ff;
  --roxo-selo: #6a2fb8;
  --c1: #3a1868; --c2: #522795; --c3: #6a39bd; --c4: #8a55dd; --c5: #b386f2;
  --c6: #9a63e3; --c7: #7a45c9; --c8: #53279a; --c9: #3b1a6b;
  --t-fato: #a9d0ff; --t-proprio: #6ff0e4; --t-estim: #ffd583; --t-prem: #ecd2ff; --t-interno: #d6cce6;
  --f-corpo: 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--fundo-escuro); }
body {
  margin: 0; min-height: 100vh; font-family: var(--f-corpo); color: var(--texto); font-size: 14px; line-height: 1.45;
  background:
    radial-gradient(ellipse 38% 70% at -4% 92%, #ffffff 0%, #f6dcf3 28%, rgba(214, 120, 210, 0.55) 55%, rgba(160, 60, 180, 0) 80%),
    linear-gradient(100deg, #c77fd0 0%, #8e2aa6 22%, #6d0f88 45%, #4a0a6a 72%, #3a0858 100%);
  background-color: var(--fundo);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 36px;
  position: relative; overflow-x: hidden; -webkit-font-smoothing: antialiased;
}
/* esferas do canto superior direito */
body::before, body::after { content: ""; position: absolute; border-radius: 50%; pointer-events: none; z-index: 0; }
body::before {
  width: 520px; height: 520px; right: -170px; top: -230px;
  background: radial-gradient(circle at 35% 60%, #7a2ad0 0%, #5a149e 55%, #43107a 100%);
}
body::after {
  width: 150px; height: 150px; right: 150px; top: 2px;
  background: radial-gradient(circle at 70% 40%, #a171f5 0%, #7b45e0 70%, #6b35d0 100%);
}

.palco { position: relative; z-index: 1; max-width: 1240px; margin: 0 auto; display: grid; gap: 22px; }

.logo { width: min(460px, 82vw); aspect-ratio: 1780 / 400; position: relative; overflow: hidden; max-width: 100%; }
.logo img { position: absolute; width: 112.36%; max-width: none; left: -6.18%; top: -28.75%; }
.logo h1 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); margin: 0; }

.grade { display: grid; grid-template-columns: repeat(20, minmax(0, 1fr)); gap: 14px; }
.cartao { grid-column: span 4; }
.cartao.baixo { grid-column: span 5; }

.cartao {
  position: relative; min-width: 0; min-height: 300px;
  background: var(--cor); border: 2px solid var(--teal); border-radius: 8px;
  padding: 20px 20px 18px; display: flex; flex-direction: column; gap: 12px;
  cursor: pointer; transition: transform .18s ease, box-shadow .18s ease;
}
.cartao:hover { transform: translateY(-3px); box-shadow: 0 14px 30px rgba(20, 0, 40, 0.35); }
.cartao h2 {
  margin: 0; padding-right: 30px; font-size: 18px; font-weight: 400; line-height: 1.38; color: var(--branco);
  min-height: 2.76em; text-wrap: balance; display: flex; align-items: flex-end;
}
.cartao .regua { height: 2px; background: var(--branco); opacity: .92; }
.cartao p { margin: 0; font-size: 13px; line-height: 1.42; color: var(--branco); opacity: .93; }
.c5 p, .c5 h2 { color: #fbf7ff; }

/* número-âncora do cartão, à esquerda do selo */
.destaque { margin-top: auto; padding: 10px 62px 0 0; display: grid; gap: 1px; min-height: 48px; }
.destaque b { font-size: 21px; font-weight: 700; line-height: 1.1; color: var(--branco); letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.destaque span { font-size: 11.5px; line-height: 1.3; color: var(--branco); opacity: .88; }

.seta {
  position: absolute; top: 16px; right: 14px; width: 30px; height: 30px; border: 0; border-radius: 6px;
  background: transparent; color: var(--branco); cursor: pointer; display: grid; place-items: center; padding: 0;
  transition: background .15s ease, transform .2s ease;
}
.seta svg { width: 16px; height: 16px; }
.cartao:hover .seta { background: rgba(255, 255, 255, 0.16); transform: rotate(180deg); }
.seta:focus-visible { outline: 2px solid var(--branco); outline-offset: 2px; }

.selo {
  position: absolute; right: 12px; bottom: 12px; min-width: 44px; height: 44px; padding: 0 6px; border-radius: 7px;
  display: grid; place-items: center; font-weight: 800; font-size: 25px; letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums; background: var(--teal); color: var(--branco);
}

.c1 { --cor: var(--c1); } .c2 { --cor: var(--c2); } .c3 { --cor: var(--c3); } .c4 { --cor: var(--c4); } .c5 { --cor: var(--c5); }
.c6 { --cor: var(--c6); } .c7 { --cor: var(--c7); } .c8 { --cor: var(--c8); } .c9 { --cor: var(--c9); }

/* Janela de detalhe */
dialog {
  width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 48px); padding: 0; border: 2px solid var(--teal); border-radius: 10px;
  background: var(--c1); color: var(--texto); overflow: auto;
}
dialog::backdrop { background: rgba(28, 4, 48, 0.62); backdrop-filter: blur(3px); }
.det { display: grid; gap: 16px; padding: 24px 24px 26px; }
.det-topo { display: flex; align-items: center; gap: 14px; }
.det-topo .selo { position: static; flex: none; }
.det-topo h2 { margin: 0; font-size: 22px; font-weight: 500; line-height: 1.25; color: var(--branco); flex: 1; text-wrap: balance; }
.fechar {
  flex: none; width: 36px; height: 36px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.3);
  background: transparent; color: var(--branco); font: 500 20px/1 var(--f-corpo); cursor: pointer;
}
.fechar:hover { background: rgba(255, 255, 255, 0.12); }
.fechar:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
.det .regua { height: 2px; background: var(--branco); opacity: .9; }
.det .resumo { margin: 0; font-size: 15px; font-weight: 500; color: var(--branco); max-width: 60ch; }
.det h3 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--t-proprio); }
.secao { display: grid; gap: 9px; padding-top: 6px; border-top: 1px solid rgba(255, 255, 255, 0.14); }
.det ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 9px; }
.det li { position: relative; padding-left: 18px; font-size: 13.5px; color: var(--texto); }
.det li::before { content: ""; position: absolute; left: 0; top: .6em; width: 7px; height: 7px; border-radius: 2px; background: var(--teal); }
.det li small { display: block; color: var(--texto-2); font-size: 12.5px; }
.det li .tag { margin-left: 6px; }
.det .nota { margin: 0; font-size: 12.5px; color: var(--texto-2); }
.ancoras { display: grid; gap: 10px; }
.ancora { border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 8px; padding: 12px 14px; display: grid; gap: 3px; background: rgba(255, 255, 255, 0.05); }
.ancora b { font-size: 20px; font-weight: 700; color: var(--branco); letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.ancora span { font-size: 12.5px; color: var(--texto-2); }
.tag { font-size: 10.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; white-space: nowrap; }
.tag::before { content: "● "; }
.t-fato { color: var(--t-fato); } .t-proprio { color: var(--t-proprio); } .t-estim { color: var(--t-estim); }
.t-prem { color: var(--t-prem); } .t-interno { color: var(--t-interno); }
.planos { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.plano { border: 1px solid rgba(255, 255, 255, 0.22); border-radius: 8px; padding: 10px; display: grid; gap: 1px; }
.plano b { font-size: 16px; color: var(--branco); font-variant-numeric: tabular-nums; }
.plano span { font-size: 12px; color: var(--texto-2); }

@media (max-width: 1080px) {
  .grade { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .cartao, .cartao.baixo { grid-column: span 2; }
  .cartao.baixo.par { grid-column: span 3; }
}
@media (max-width: 760px) {
  .grade { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cartao, .cartao.baixo, .cartao.baixo.par { grid-column: span 1; }
  .cartao.ultimo { grid-column: span 2; }
  body::before { width: 340px; height: 340px; right: -150px; top: -170px; }
  body::after { width: 90px; height: 90px; right: 90px; top: 4px; }
}
@media (max-width: 480px) {
  .grade { grid-template-columns: 1fr; }
  .cartao.ultimo { grid-column: span 1; }
  .cartao { min-height: 0; }
  .planos { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) {
  .cartao, .seta { transition: none; }
  .cartao:hover { transform: none; }
  .cartao:hover .seta { transform: none; }
}
</style>
</head>

const lista = itens => `<ul>${itens.map(([t, s, g]) => `<li>${esc(t)}${tag(g)}${s ? `<small>${esc(s)}</small>` : ''}</li>`).join('')}</ul>`;

const grade = document.getElementById('grade');
grade.innerHTML = BLOCOS.map((b, i) => {
  const classes = ['cartao', 'c' + (i + 1)];
  if (i >= 5) classes.push('baixo');
  if (i === 7 || i === 8) classes.push('par');
  if (i === 8) classes.push('ultimo');
  return `<article class="${classes.join(' ')}" data-i="${i}">
    <h2>${esc(b.titulo)}</h2>
    <button class="seta" type="button" id="seta-${i + 1}" aria-label="Ver detalhe de ${esc(b.titulo)}">${SETA}</button>
    <div class="regua"></div>
    <p>${esc(b.resumo)}</p>
    <div class="destaque"><b>${esc(b.destaque[0])}</b><span>${esc(b.destaque[1])}</span></div>
    <span class="selo" aria-hidden="true">${num(i)}</span>
  </article>`;
}).join('');

const janela = document.getElementById('janela');
const det = document.getElementById('det');
let origem = null;

function abrir(i) {
  const b = BLOCOS[i];
  const planos = b.planos ? `<div class="planos">${b.planos.map(([v, n]) => `<div class="plano"><b>${esc(v)}</b><span>${esc(n)}</span></div>`).join('')}</div>` : '';
  const secoes = (b.secoes || []).map(s => `<div class="secao"><h3>${esc(s.titulo)}</h3>${lista(s.itens)}${s.nota ? `<p class="nota">${esc(s.nota)}</p>` : ''}</div>`).join('');
  const ancoras = b.ancoras.length ? `<div class="ancoras">${b.ancoras.map(([v, l, t]) =>
    `<div class="ancora"><b>${esc(v)}</b><span>${esc(l)}</span><span class="tag ${T[t][0]}">${T[t][1]}</span></div>`).join('')}</div>` : '';
  det.innerHTML = `
    <div class="det-topo">
      <span class="selo">${num(i)}</span>
      <h2 id="det-titulo">${esc(b.titulo)}</h2>
      <button class="fechar" type="button" id="fechar" aria-label="Fechar">×</button>
    </div>
    <div class="regua"></div>
    <p class="resumo">${esc(b.resumo)}</p>
    ${planos}${lista(b.itens)}${secoes}${ancoras}`;
  janela.style.background = getComputedStyle(document.querySelector('.c' + (i + 1))).getPropertyValue('--cor');
  if (i === 4 || i === 3) janela.style.background = 'var(--c3)';
  document.getElementById('fechar').addEventListener('click', () => janela.close());
  janela.showModal();
  det.scrollTop = 0;
}

grade.addEventListener('click', e => {
  const c = e.target.closest('.cartao');
  if (!c) return;
  origem = c.querySelector('.seta');
  abrir(+c.dataset.i);
});
janela.addEventListener('click', e => { if (e.target === janela) janela.close(); });
janela.addEventListener('close', () => { if (origem) origem.focus(); });
</script>

</body>
</html>
