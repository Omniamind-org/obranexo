[project]
name = "obranexo"
version = "0.1.0"
description = "Plataforma de inteligência comercial agêntica para contratações públicas (MVP AKCIT Camp 2026)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
  { name = "Kauan Divino" },
  { name = "Fabrycio Nakano" },
  { name = "Victor Emanuel" },
  { name = "Maykon Adriell" },
]
dependencies = [
  "google-genai>=1.0",
  "anthropic>=2.1",
  "groq>=1.0",
  "pydantic>=2.7",
  "pymupdf>=1.26,<2",  # o pacote 2.0 (pymupdf-lite) não instala com uv/pip: metadados com outro nome
  "httpx>=0.27",
  "tenacity>=8.3",
  "rapidfuzz>=3.9",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "python-docx>=1.1",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.6"]

[project.scripts]
obranexo = "obranexo.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 170
target-version = "py312"
src = ["src", "tests", "app", "eval"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integracao: chama a API do provedor de LLM configurado (lento, usa cota)",
  "retrato: roda os 9 casos congelados e compara com o retrato da demo (lento; pule com -m \"not retrato\")",
]
