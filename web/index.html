<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ObraNexo // Mission Control PNCP</title>
  <meta name="description" content="Inteligência comercial agêntica e auditoria forense para contratações públicas">
  <link rel="icon" type="image/png" href="/images/emblem.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-brand">
        <a class="brand" href="#/inicio">
          <img class="brand-emblem" src="/images/emblem.png" alt="ObraNexo">
          <img class="brand-text-img" src="/images/text.png" alt="ObraNexo">
        </a>
      </div>
      <nav class="nav" id="nav" aria-label="Navegação principal">
        <a href="#/inicio" data-rota="inicio"><span data-icon="home"></span><span>Painel Geral</span><span class="nav-hotkey">01</span></a>
        <a href="#/agente" data-rota="agente"><span data-icon="bolt"></span><span>Prospecção IA</span><span class="nav-hotkey">02</span></a>
        <a href="#/catalogo" data-rota="catalogo"><span data-icon="box"></span><span>Catálogo Técnico</span><span class="nav-hotkey">03</span></a>
        <a href="#/demandas" data-rota="demandas"><span data-icon="search"></span><span>Radar PNCP</span><span class="nav-hotkey">04</span></a>
        <a href="#/analises" data-rota="analises"><span data-icon="file"></span><span>Dossiês & Análises</span><span class="nav-hotkey">05</span></a>
        <a href="#/metricas" data-rota="metricas"><span data-icon="chart"></span><span>Métricas</span><span class="nav-hotkey">06</span></a>
        <a href="#/sobre" data-rota="sobre"><span data-icon="info"></span><span>Arquitetura</span><span class="nav-hotkey">07</span></a>
      </nav>
    </header>
    <main class="main">
      <div class="scanlines" aria-hidden="true"></div>
      <div id="view" class="view" tabindex="-1"></div>
    </main>
  </div>
  <div id="status-sistema" class="status-dock" aria-label="Telemetria do sistema">
    <div class="skeleton-line" style="width:180px;height:24px"></div>
  </div>
  <div id="modal-root"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
