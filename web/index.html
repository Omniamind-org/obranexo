<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ObraNexo</title>
  <meta name="description" content="Encontre licitações públicas aderentes ao seu catálogo, com cada conclusão ligada ao trecho do edital">
  <link rel="icon" type="image/png" href="/images/emblem.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
  <script>
    // Aplica o tema antes da primeira pintura (sem piscar): escolha salva ou, sem ela, o tema do sistema
    (function () {
      var t = null;
      try { t = localStorage.getItem('obranexo.tema'); } catch (e) { /* sem storage */ }
      if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/inicio" aria-label="ObraNexo — início">
      <img class="brand-emblem" src="/images/emblem.png" alt="">
      <img class="brand-text-img" src="/images/text.png" alt="ObraNexo">
    </a>
    <nav class="nav" id="nav" aria-label="Navegação principal">
      <a href="#/inicio" data-rota="inicio">Início</a>
      <a href="#/agente" data-rota="agente">Prospecção</a>
      <a href="#/demandas" data-rota="demandas">Licitações</a>
      <a href="#/analises" data-rota="analises">Análises</a>
      <a href="#/catalogo" data-rota="catalogo">Catálogo</a>
      <a href="#/metricas" data-rota="metricas">Qualidade</a>
      <a href="#/sobre" data-rota="sobre">Como funciona</a>
    </nav>
    <div class="topo-dir">
      <div id="status-sistema" class="status-ia" aria-label="Provedor de IA"></div>
      <div id="conta" class="conta"></div>
      <button id="tema" class="tema-btn" type="button" aria-label="Alternar tema"></button>
    </div>
  </header>
  <main id="view" class="view" tabindex="-1"></main>
  <button id="chat-abrir" class="chat-abrir" type="button" aria-controls="chat" aria-expanded="false">
    <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/><path d="M8.5 10.5h7M8.5 13.5h4"/></svg>
    <span>Perguntar</span>
  </button>
  <aside id="chat" class="chat" aria-label="Assistente" hidden></aside>
  <div id="modal-root"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="dica" class="dica" role="tooltip"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
